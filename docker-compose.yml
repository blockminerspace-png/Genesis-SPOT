services:
  postgres:
    image: postgres:16-alpine
    container_name: genesis-spot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: botspot
    ports:
      - "5433:5432"
    volumes:
      - genesis_spot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d botspot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  genesis_spot_pgdata:
